<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harga Emas & Kurs Dolar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #f7f0e6 0%, #e8dccc 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* ===== KARTU UTAMA ===== */
        .card {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 248, 240, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 56px;
            padding: 48px 44px;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.3),
                        inset 0 1px 2px rgba(255, 245, 225, 0.7);
            border: 1px solid rgba(255, 240, 215, 0.5);
            transition: transform 0.35s ease;
        }

        .card:hover {
            transform: scale(1.005);
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 36px;
            border-bottom: 2px dashed #dccfc0;
            padding-bottom: 24px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #2d2419;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #8a7a68;
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .badge-update {
            display: inline-block;
            margin-top: 10px;
            background: #dccfc0;
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #3d3228;
            letter-spacing: 0.3px;
        }

        /* ===== GRID DATA ===== */
        .grid-data {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 28px;
        }

        .data-box {
            background: rgba(255, 242, 230, 0.5);
            border-radius: 32px;
            padding: 28px 22px;
            border: 1px solid #e6d8c8;
            text-align: center;
            transition: all 0.3s ease;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .data-box:hover {
            background: rgba(255, 242, 230, 0.8);
            border-color: #c4b09c;
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(160, 130, 100, 0.12);
        }

        .data-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a7a68;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .data-value {
            font-size: 2.1rem;
            font-weight: 700;
            color: #2d2419;
            transition: all 0.3s;
        }

        .data-value.loading {
            opacity: 0.4;
            animation: pulse 1.2s infinite;
        }

        .data-value.error {
            color: #b35a4a;
            font-size: 1rem;
            font-weight: 400;
        }

        .data-sub {
            font-size: 0.8rem;
            color: #9a8a78;
            margin-top: 6px;
        }

        /* ===== TOMBOL ===== */
        .btn-group {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 6px 0 18px;
        }

        .btn {
            padding: 14px 34px;
            border: none;
            border-radius: 60px;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s ease;
            background: #dccfc0;
            color: #2d2419;
            box-shadow: 0 4px 12px rgba(140, 110, 80, 0.1);
            flex: 0 1 auto;
        }

        .btn-primary {
            background: #b8957a;
            color: #fff6ec;
            box-shadow: 0 8px 24px rgba(184, 149, 122, 0.35);
        }

        .btn-primary:hover {
            background: #a07f67;
            transform: translateY(-3px);
            box-shadow: 0 14px 32px rgba(160, 120, 90, 0.25);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #b8957a;
            color: #4d3c2e;
        }

        .btn-outline:hover {
            background: #b8957a;
            color: #fff6ec;
            transform: translateY(-3px);
        }

        /* ===== STATUS BAR ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #a28e7a;
            border-top: 1px solid #e6d8c8;
            padding-top: 18px;
            margin-top: 4px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6f9e7b;
            margin-right: 6px;
            animation: blink 1.6s infinite;
        }

        /* ===== ANIMASI ===== */
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .card {
                padding: 32px 20px;
                border-radius: 36px;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .grid-data {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .data-value {
                font-size: 1.7rem;
            }
            .btn {
                width: 100%;
                padding: 14px 20px;
            }
            .status-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 24px 16px;
            }
            .data-box {
                padding: 20px 16px;
                min-height: 110px;
            }
            .data-value {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <h1>📊 Harga Emas & Kurs Dolar</h1>
            <p>Data real-time dari berbagai sumber</p>
            <span class="badge-update" id="lastUpdate">⏳ Memuat data...</span>
        </div>

        <!-- ===== GRID DATA ===== -->
        <div class="grid-data">
            <!-- Emas -->
            <div class="data-box">
                <div class="data-label">💰 Harga Emas</div>
                <div class="data-value loading" id="emasValue">Memuat...</div>
                <div class="data-sub" id="emasSub">per gram (IDR)</div>
            </div>

            <!-- Dolar -->
            <div class="data-box">
                <div class="data-label">💵 Kurs Dolar</div>
                <div class="data-value loading" id="dolarValue">Memuat...</div>
                <div class="data-sub" id="dolarSub">USD / IDR</div>
            </div>
        </div>

        <!-- ===== TOMBOL ===== -->
        <div class="btn-group">
            <button class="btn btn-primary" id="refreshBtn">🔄 Refresh Data</button>
            <button class="btn btn-outline" id="toggleAutoBtn">⏸️ Matikan Auto-Update</button>
        </div>

        <!-- ===== STATUS BAR ===== -->
        <div class="status-bar">
            <span>
                <span class="status-dot"></span>
                <span id="statusText">Siap mengambil data...</span>
            </span>
            <span id="timestampDisplay">⏱️ Terakhir: --:--:--</span>
        </div>

    </div>

    <script>
        // ================================================================
        //  JAVASCRIPT LENGKAP – FETCH DATA + AUTO UPDATE + UI ELEGAN
        // ================================================================

        // ---- DOM ELEMEN ----
        const emasValue = document.getElementById('emasValue');
        const emasSub = document.getElementById('emasSub');
        const dolarValue = document.getElementById('dolarValue');
        const dolarSub = document.getElementById('dolarSub');
        const lastUpdate = document.getElementById('lastUpdate');
        const statusText = document.getElementById('statusText');
        const timestampDisplay = document.getElementById('timestampDisplay');
        const refreshBtn = document.getElementById('refreshBtn');
        const toggleAutoBtn = document.getElementById('toggleAutoBtn');

        // ---- STATE ----
        let autoUpdate = true;
        let autoInterval = null;
        let isFetching = false;

        // ---- FORMAT ANGKA ----
        function formatRupiah(angka) {
            if (angka === null || angka === undefined || isNaN(angka)) return 'Tidak tersedia';
            return 'Rp ' + Math.round(angka).toLocaleString('id-ID');
        }

        function formatDolar(angka) {
            if (angka === null || angka === undefined || isNaN(angka)) return 'Tidak tersedia';
            return 'Rp ' + angka.toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // ---- AMBIL DATA DARI API ----
        async function fetchData() {
            if (isFetching) return;
            isFetching = true;

            // Tampilkan loading
            emasValue.className = 'data-value loading';
            dolarValue.className = 'data-value loading';
            emasValue.textContent = '⏳ Memuat...';
            dolarValue.textContent = '⏳ Memuat...';
            statusText.textContent = '🔄 Mengambil data...';

            try {
                // 🔥 Jalankan kedua API secara paralel
                const [emasResponse, dolarResponse] = await Promise.all([
                    fetch('https://GoldPrice.Today/api.php?data=live'),
                    fetch('https://api.exchangerate.fun/latest?base=USD')
                ]);

                if (!emasResponse.ok || !dolarResponse.ok) {
                    throw new Error('Gagal mengambil data dari server');
                }

                const emasData = await emasResponse.json();
                const dolarData = await dolarResponse.json();

                // ---- Proses Harga Emas ----
                let hargaEmas = null;
                let hargaEmasInIDR = null;

                // Coba ambil dari field IDR atau USD lalu konversi ke IDR
                if (emasData.IDR && emasData.IDR.gold_price) {
                    hargaEmasInIDR = emasData.IDR.gold_price;
                } else if (emasData.USD && emasData.USD.gold_price) {
                    // Kalau cuma USD, konversi pakai kurs yang kita punya
                    const kursIDR = dolarData.rates?.IDR || 15000; // fallback
                    hargaEmasInIDR = emasData.USD.gold_price * kursIDR;
                } else {
                    // Coba cari field gold_price di mana saja
                    for (const key in emasData) {
                        if (emasData[key]?.gold_price) {
                            hargaEmasInIDR = emasData[key].gold_price;
                            break;
                        }
                    }
                }

                if (hargaEmasInIDR) {
                    emasValue.className = 'data-value';
                    emasValue.textContent = formatRupiah(hargaEmasInIDR);
                    emasSub.textContent = 'per gram (IDR)';
                } else {
                    throw new Error('Format data emas tidak dikenali');
                }

                // ---- Proses Kurs Dolar ----
                const kursIDR = dolarData.rates?.IDR;
                if (kursIDR) {
                    dolarValue.className = 'data-value';
                    dolarValue.textContent = formatDolar(kursIDR);
                    dolarSub.textContent = '1 USD = ' + formatRupiah(kursIDR);
                } else {
                    throw new Error('Kurs dolar tidak tersedia');
                }

                // ---- Update status ----
                const now = new Date();
                const waktu = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                timestampDisplay.textContent = '⏱️ Terakhir: ' + waktu;
                lastUpdate.textContent = '✅ Update: ' + waktu;
                statusText.textContent = '✅ Data berhasil dimuat';

            } catch (error) {
                console.error('Error:', error);
                emasValue.className = 'data-value error';
                dolarValue.className = 'data-value error';
                emasValue.textContent = '⚠️ Gagal memuat';
                dolarValue.textContent = '⚠️ Gagal memuat';
                statusText.textContent = '❌ ' + error.message;
                lastUpdate.textContent = '⏳ Gagal update';
            } finally {
                isFetching = false;
            }
        }

        // ---- AUTO UPDATE ----
        function startAutoUpdate() {
            if (autoInterval) clearInterval(autoInterval);
            autoInterval = setInterval(() => {
                if (autoUpdate) {
                    fetchData();
                }
            }, 60000); // Update tiap 60 detik
        }

        function toggleAutoUpdate() {
            autoUpdate = !autoUpdate;
            if (autoUpdate) {
                toggleAutoBtn.textContent = '⏸️ Matikan Auto-Update';
                toggleAutoBtn.classList.remove('btn-primary');
                toggleAutoBtn.classList.add('btn-outline');
                statusText.textContent = '🔄 Auto-update aktif (60 detik)';
                startAutoUpdate();
            } else {
                toggleAutoBtn.textContent = '▶️ Aktifkan Auto-Update';
                toggleAutoBtn.classList.remove('btn-outline');
                toggleAutoBtn.classList.add('btn-primary');
                statusText.textContent = '⏸️ Auto-update dimatikan';
                if (autoInterval) {
                    clearInterval(autoInterval);
                    autoInterval = null;
                }
            }
        }

        // ---- EVENT LISTENER ----
        refreshBtn.addEventListener('click', function() {
            fetchData();
        });

        toggleAutoBtn.addEventListener('click', toggleAutoUpdate);

        // ---- LOAD PERTAMA ----
        fetchData();
        startAutoUpdate();

        // ---- TAMPILAN AWAL ----
        toggleAutoBtn.textContent = '⏸️ Matikan Auto-Update';
        toggleAutoBtn.classList.remove('btn-primary');
        toggleAutoBtn.classList.add('btn-outline');

        // ---- HANDLE ERROR JIKA NETWORK OFFLINE ----
        window.addEventListener('online', function() {
            statusText.textContent = '📶 Kembali online, refresh data...';
            fetchData();
        });

        console.log('✅ Halaman siap! Data akan update otomatis tiap 60 detik.');
    </script>

</body>
</html>
