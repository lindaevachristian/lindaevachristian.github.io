<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duplikat line remover · unique lines</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0d1117;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }
    .card {
      max-width: 1000px;
      width: 100%;
      background: #161b22;
      border-radius: 28px;
      padding: 2rem 2rem 2.5rem;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.8);
      border: 1px solid #30363d;
    }
    h1 {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 500;
      font-size: 1.8rem;
      letter-spacing: -0.3px;
      color: #f0f6fc;
      margin-bottom: 0.4rem;
    }
    h1 small {
      font-size: 1rem;
      font-weight: 400;
      color: #8b949e;
      margin-left: 0.5rem;
    }
    .sub {
      color: #8b949e;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      border-left: 3px solid #2f81f7;
      padding-left: 1rem;
      background: #0d1117;
      border-radius: 0 12px 12px 0;
      line-height: 1.5;
    }
    .flex-grid {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .input-area {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      color: #c9d1d9;
      font-weight: 450;
    }
    .label-row span:first-child {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background: #21262d;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      font-size: 0.75rem;
      color: #8b949e;
      border: 1px solid #30363d;
    }
    textarea {
      width: 100%;
      height: 260px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 18px;
      padding: 1.2rem 1.2rem;
      color: #e6edf3;
      font-size: 0.9rem;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      resize: vertical;
      transition: border 0.15s, box-shadow 0.15s;
      line-height: 1.6;
      tab-size: 2;
    }
    textarea:focus {
      outline: none;
      border-color: #2f81f7;
      box-shadow: 0 0 0 3px rgba(47, 129, 247, 0.25);
    }
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1rem;
      margin: 0.5rem 0 0.2rem;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    .btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 0.6rem 1.4rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.2px;
    }
    .btn-primary {
      background: #2f81f7;
      border-color: #2f81f7;
      color: #fff;
    }
    .btn-primary:hover {
      background: #388bfd;
      border-color: #388bfd;
    }
    .btn-outline {
      background: transparent;
      border-color: #30363d;
    }
    .btn-outline:hover {
      background: #21262d;
      border-color: #484f58;
    }
    .btn-clear {
      background: transparent;
      border-color: #30363d;
      color: #8b949e;
    }
    .btn-clear:hover {
      background: #21262d;
      color: #f0f6fc;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1.2rem;
      font-size: 0.9rem;
      color: #8b949e;
      background: #0d1117;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      border: 1px solid #21262d;
    }
    .stats strong {
      color: #e6edf3;
      font-weight: 500;
    }
    .output-area {
      margin-top: 1.2rem;
      border-top: 1px solid #21262d;
      padding-top: 1.2rem;
    }
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }
    .output-header h3 {
      color: #c9d1d9;
      font-weight: 450;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .copy-btn {
      background: transparent;
      border: 1px solid #30363d;
      color: #8b949e;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.15s;
    }
    .copy-btn:hover {
      background: #21262d;
      color: #f0f6fc;
      border-color: #484f58;
    }
    #outputText {
      width: 100%;
      min-height: 160px;
      max-height: 350px;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 16px;
      padding: 1rem 1.2rem;
      color: #e6edf3;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      resize: vertical;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #outputText:focus {
      outline: none;
      border-color: #2f81f7;
    }
    .footer-note {
      margin-top: 1.2rem;
      color: #484f58;
      font-size: 0.75rem;
      display: flex;
      justify-content: flex-end;
      gap: 1.2rem;
    }
    .status-msg {
      color: #8b949e;
      font-size: 0.85rem;
      padding: 0.2rem 0 0 0.2rem;
    }
    @media (max-width: 650px) {
      .card { padding: 1.5rem; }
      .action-bar { flex-direction: column; align-items: stretch; }
      .btn-group { justify-content: stretch; }
      .btn { flex: 1; justify-content: center; }
      .stats { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="card">
  <h1>
    <span>🧹</span> Duplikat remover
    <small>unique lines</small>
  </h1>
  <div class="sub">
    Paste teks dengan banyak duplikat → klik “Hapus duplikat” → hasil baris unik (urutan tetap)
  </div>

  <div class="flex-grid">
    <div class="input-area">
      <div class="label-row">
        <span><span>📋</span> Input (baris duplikat)</span>
        <span class="badge" id="lineCountInput">0 baris</span>
      </div>
      <textarea id="inputText" placeholder="Tempel token atau teks di sini …&#10;contoh:&#10;ghp_xelXmyDjt...&#10;ghp_xelXmyDjt...&#10;ghp_KMSjE26DD..."></textarea>
    </div>

    <div class="action-bar">
      <div class="btn-group">
        <button class="btn btn-primary" id="removeBtn">🧽 Hapus duplikat</button>
        <button class="btn btn-outline" id="sampleBtn">📥 Contoh</button>
        <button class="btn btn-clear" id="clearBtn">✕ Kosongkan</button>
      </div>
      <div class="stats" id="statsDisplay">
        <span>📊 <strong id="uniqueCount">0</strong> unik</span>
        <span>•</span>
        <span>📎 <strong id="totalCount">0</strong> total</span>
      </div>
    </div>

    <div class="output-area">
      <div class="output-header">
        <h3><span>✅</span> Hasil (tanpa duplikat)</h3>
        <button class="copy-btn" id="copyBtn">📄 Salin</button>
      </div>
      <div id="outputText" contenteditable="false" spellcheck="false">—</div>
      <div class="status-msg" id="statusMsg">Menunggu input …</div>
    </div>
  </div>
  <div class="footer-note">
    <span>🔁 urutan baris dipertahankan (kemunculan pertama)</span>
    <span>⚡ garis kosong diabaikan</span>
  </div>
</div>

<script>
  (function() {
    const inputEl = document.getElementById('inputText');
    const outputEl = document.getElementById('outputText');
    const removeBtn = document.getElementById('removeBtn');
    const sampleBtn = document.getElementById('sampleBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const uniqueCountEl = document.getElementById('uniqueCount');
    const totalCountEl = document.getElementById('totalCount');
    const lineCountInput = document.getElementById('lineCountInput');
    const statusMsg = document.getElementById('statusMsg');

    // ----- helpers -----
    function getLines(text) {
      return text.split(/\r?\n/);
    }

    // remove empty lines? we keep empty lines? we choose to ignore empty lines (they are not meaningful for tokens)
    // but we want to preserve empty lines? Most use case: tokens – we skip empty.
    function removeDuplicateLines(text) {
      const lines = getLines(text);
      const seen = new Set();
      const result = [];
      for (let line of lines) {
        // trim whitespace? For tokens we want exact match (including spaces), but we treat empty lines as ignored.
        // we keep exact line, but skip empty lines (common for token lists)
        const trimmed = line.trim();
        if (trimmed === '') continue;   // skip blank lines
        if (!seen.has(line)) {
          seen.add(line);
          result.push(line);
        }
      }
      return result;
    }

    function updateStats(uniqueLines, totalLines) {
      uniqueCountEl.textContent = uniqueLines.length;
      totalCountEl.textContent = totalLines;
    }

    function renderOutput(linesArray) {
      if (linesArray.length === 0) {
        outputEl.textContent = '— (tidak ada baris unik)';
        statusMsg.textContent = '✨ Tidak ada baris unik ditemukan.';
        return;
      }
      outputEl.textContent = linesArray.join('\n');
      statusMsg.textContent = `✅ ${linesArray.length} baris unik (dari ${inputEl.value.split(/\r?\n/).filter(l => l.trim() !== '').length} total baris bermakna)`;
    }

    function processInput() {
      const raw = inputEl.value;
      const allLines = getLines(raw).filter(l => l.trim() !== '');
      const uniqueLines = removeDuplicateLines(raw); // using our function that skips empty

      // update stats
      updateStats(uniqueLines, allLines.length);
      renderOutput(uniqueLines);
      lineCountInput.textContent = allLines.length + ' baris';
    }

    // ----- event listeners -----
    removeBtn.addEventListener('click', processInput);

    sampleBtn.addEventListener('click', function() {
      const sample = `aa
aaa
aaaa
aaaaa
aaaaaa
aaaaaaaa
aaaaaaaaaaa
aaaaaaaaaaaaa
aaaaaaaaaaaaaaaa
aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa`;
      inputEl.value = sample;
      lineCountInput.textContent = sample.split(/\r?\n/).filter(l => l.trim() !== '').length + ' baris';
      processInput();
    });

    clearBtn.addEventListener('click', function() {
      inputEl.value = '';
      outputEl.textContent = '—';
      uniqueCountEl.textContent = '0';
      totalCountEl.textContent = '0';
      lineCountInput.textContent = '0 baris';
      statusMsg.textContent = '⌨️ Kosong — tempel teks dan klik hapus.';
    });

    copyBtn.addEventListener('click', function() {
      const text = outputEl.textContent;
      if (!text || text === '—' || text === '— (tidak ada baris unik)') {
        statusMsg.textContent = '⚠️ Tidak ada hasil untuk disalin.';
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        statusMsg.textContent = '📋 Disalin ke clipboard!';
        setTimeout(() => {
          const uniqueLines = outputEl.textContent.split('\n').filter(l => l.trim() !== '');
          if (uniqueLines.length > 0) {
            statusMsg.textContent = `✅ ${uniqueLines.length} baris unik siap.`;
          } else {
            statusMsg.textContent = '📋 Disalin.';
          }
        }, 1500);
      }).catch(() => {
        // fallback
        const range = document.createRange();
        range.selectNode(outputEl);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        document.execCommand('copy');
        window.getSelection().removeAllRanges();
        statusMsg.textContent = '📋 Disalin (fallback)';
      });
    });

    // optional: live stats on input change (without removing duplicates)
    inputEl.addEventListener('input', function() {
      const raw = this.value;
      const lines = getLines(raw).filter(l => l.trim() !== '');
      lineCountInput.textContent = lines.length + ' baris';
      // we don't auto-remove, but we update total count
      if (lines.length === 0) {
        totalCountEl.textContent = '0';
        uniqueCountEl.textContent = '0';
        outputEl.textContent = '—';
        statusMsg.textContent = '⌨️ Mengetik …';
      } else {
        // show preview stats but not override output until user clicks
        const unique = removeDuplicateLines(raw);
        totalCountEl.textContent = lines.length;
        uniqueCountEl.textContent = unique.length;
        // optionally show preview in output? we don't to keep explicit.
        // we set status
        statusMsg.textContent = `📝 ${lines.length} baris, ${unique.length} unik (klik "Hapus duplikat")`;
      }
    });

    // manual trigger on page load with empty state
    window.addEventListener('DOMContentLoaded', function() {
      clearBtn.click();
    });

    // additional: if user types, we can also set a hotkey? not needed.
    // but we also want to process on paste? no, explicit.
    // also we add a "auto" behavior? not.

    // small extra: double click on output to copy? we keep copy button.
  })();
</script>
</body>
</html>
