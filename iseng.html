<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulasi Toto Macau - Auto Generate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0ece6;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #fffcf8;
            border-radius: 32px;
            padding: 36px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
            border: 1px solid #ede8e2;
        }
        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px dashed #ede8e2;
            margin-bottom: 28px;
        }
        .header h1 {
            font-size: 1.8rem;
            color: #2d2419;
        }
        .header p {
            color: #8a7a68;
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .badge {
            display: inline-block;
            background: #2d5a3d;
            color: #fff;
            padding: 2px 16px;
            border-radius: 40px;
            font-size: 0.65rem;
            letter-spacing: 0.5px;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            color: #2d2419;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        .form-group .hint {
            font-size: 0.75rem;
            color: #8a7a68;
            margin-top: 4px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .input-row input {
            flex: 1;
            min-width: 60px;
            padding: 14px 16px;
            border: 2px solid #e0d6cc;
            border-radius: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            text-align: center;
            background: #fff;
            outline: none;
            transition: 0.25s;
        }
        .input-row input:focus {
            border-color: #2d5a3d;
            box-shadow: 0 0 0 4px rgba(45, 90, 61, 0.1);
        }

        select, input[type="number"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0d6cc;
            border-radius: 16px;
            font-size: 1rem;
            background: #fff;
            outline: none;
            transition: 0.25s;
        }
        select:focus, input[type="number"]:focus {
            border-color: #2d5a3d;
            box-shadow: 0 0 0 4px rgba(45, 90, 61, 0.1);
        }

        .btn {
            padding: 14px 36px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.25s;
            width: 100%;
        }
        .btn-primary {
            background: #2d5a3d;
            color: #fff;
        }
        .btn-primary:hover {
            background: #1a3a2b;
            transform: translateY(-2px);
        }
        .btn-gold {
            background: #d4a373;
            color: #fff;
        }
        .btn-gold:hover {
            background: #b8895e;
            transform: translateY(-2px);
        }

        .result-box {
            margin-top: 24px;
            padding: 20px;
            background: #f6f2ec;
            border-radius: 20px;
            display: none;
        }
        .result-box.active {
            display: block;
        }
        .result-box .title {
            font-weight: 600;
            color: #2d2419;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .result-box .count {
            font-size: 0.8rem;
            color: #8a7a68;
            font-weight: 400;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .result-grid::-webkit-scrollbar {
            width: 4px;
        }
        .result-grid::-webkit-scrollbar-thumb {
            background: #d4a373;
            border-radius: 10px;
        }

        .result-item {
            background: #fff;
            padding: 10px 8px;
            border-radius: 12px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.95rem;
            color: #2d2419;
            border: 1px solid #e8e0d8;
            transition: 0.2s;
        }
        .result-item:hover {
            border-color: #d4a373;
            transform: scale(1.02);
        }
        .result-item .label {
            font-size: 0.55rem;
            color: #8a7a68;
            font-weight: 400;
            display: block;
            margin-top: 2px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }
        .btn-group .btn {
            padding: 12px;
            font-size: 0.85rem;
        }

        @media (max-width: 500px) {
            .container { padding: 20px 16px; }
            .input-row input { padding: 12px; font-size: 1rem; min-width: 44px; }
            .result-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
            .btn-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>🎯 Simulasi Toto Macau</h1>
        <p>Auto Generate Angka Jadi dari Pola Rumus</p>
        <span class="badge">📚 Edukasi Matematika</span>
    </div>

    <!-- INPUT -->
    <div class="form-group">
        <label>📝 Masukkan 4 Angka Terakhir</label>
        <div class="input-row">
            <input type="number" id="num1" min="0" max="9" value="1" />
            <input type="number" id="num2" min="0" max="9" value="2" />
            <input type="number" id="num3" min="0" max="9" value="3" />
            <input type="number" id="num4" min="0" max="9" value="4" />
        </div>
        <div class="hint">Masukkan 4 digit angka (0-9) dari hasil sebelumnya</div>
    </div>

    <div class="form-group">
        <label>📊 Jumlah Set Angka Jadi</label>
        <select id="jumlahSet">
            <option value="10">10 Set</option>
            <option value="20">20 Set</option>
            <option value="30">30 Set</option>
            <option value="40">40 Set</option>
            <option value="50" selected>50 Set</option>
            <option value="60">60 Set</option>
            <option value="70">70 Set</option>
            <option value="80">80 Set</option>
            <option value="90">90 Set</option>
            <option value="100">100 Set</option>
        </select>
    </div>

    <button class="btn btn-primary" id="generateBtn">🚀 Generate Angka Jadi</button>

    <!-- HASIL -->
    <div class="result-box" id="resultBox">
        <div class="title">
            <span>📋 Angka Jadi</span>
            <span class="count" id="resultCount">0 set</span>
        </div>
        <div class="result-grid" id="resultGrid"></div>
        <div class="btn-group">
            <button class="btn btn-gold" id="copyBtn">📋 Copy Semua</button>
            <button class="btn btn-gold" id="exportBtn">⬇️ Export TXT</button>
        </div>
    </div>

</div>

<script>
    // ================================================================
    //  SIMULASI TOTO MACAU - AUTO GENERATE ANGKA JADI
    // ================================================================

    var num1 = document.getElementById('num1');
    var num2 = document.getElementById('num2');
    var num3 = document.getElementById('num3');
    var num4 = document.getElementById('num4');
    var jumlahSet = document.getElementById('jumlahSet');
    var generateBtn = document.getElementById('generateBtn');
    var resultBox = document.getElementById('resultBox');
    var resultGrid = document.getElementById('resultGrid');
    var resultCount = document.getElementById('resultCount');
    var copyBtn = document.getElementById('copyBtn');
    var exportBtn = document.getElementById('exportBtn');

    // ---- FUNGSI GENERATE ----
    function generateAngkaJadi(angka, total) {
        var results = [];
        var a = angka[0], b = angka[1], c = angka[2], d = angka[3];

        // === SEMUA RUMUS ===
        var formulas = [];

        // 1. Penjumlahan (As+Kop, Kop+Kepala, Kepala+Ekor, As+Ekor)
        formulas.push([(a+b)%10, (b+c)%10, (c+d)%10, (a+d)%10]);
        formulas.push([(a+c)%10, (b+d)%10, (a+b+c)%10, (b+c+d)%10]);
        formulas.push([(a+b+c)%10, (a+b+d)%10, (a+c+d)%10, (b+c+d)%10]);

        // 2. Pengurangan mutlak
        formulas.push([Math.abs(a-b), Math.abs(b-c), Math.abs(c-d), Math.abs(a-d)]);
        formulas.push([Math.abs(a-c), Math.abs(b-d), Math.abs(a-d), Math.abs(b-c)]);
        formulas.push([Math.abs(a+b-c), Math.abs(b+c-d), Math.abs(a+c-b), Math.abs(b+d-c)]);

        // 3. Perkalian (digit terakhir)
        formulas.push([(a*b)%10, (b*c)%10, (c*d)%10, (a*d)%10]);
        formulas.push([(a*b*c)%10, (b*c*d)%10, (a*c*d)%10, (a*b*d)%10]);

        // 4. Tesson (pola 2D)
        var sum = a + b + c + d;
        var tesson = sum % 10;
        formulas.push([tesson, (tesson+1)%10, (tesson+2)%10, (tesson+3)%10]);
        formulas.push([(a+tesson)%10, (b+tesson)%10, (c+tesson)%10, (d+tesson)%10]);

        // 5. Mistis (n+1, n+2, n+3)
        formulas.push([(a+1)%10, (b+1)%10, (c+1)%10, (d+1)%10]);
        formulas.push([(a+2)%10, (b+2)%10, (c+2)%10, (d+2)%10]);
        formulas.push([(a+3)%10, (b+3)%10, (c+3)%10, (d+3)%10]);
        formulas.push([(a+4)%10, (b+4)%10, (c+4)%10, (d+4)%10]);
        formulas.push([(a+5)%10, (b+5)%10, (c+5)%10, (d+5)%10]);

        // 6. Kombinasi silang
        formulas.push([(a+b+c+d)%10, (a*b+c*d)%10, (a+b)*(c+d)%10, (a*b*c*d)%10]);
        formulas.push([(a+b+c+d+1)%10, (a*b+c*d+1)%10, (a+b)*(c+d)+1%10, (a*b*c*d+1)%10]);

        // 7. Pola ganjil/genap
        var genap = [0,2,4,6,8];
        var ganjil = [1,3,5,7,9];
        var polaGenap = [];
        var polaGanjil = [];
        for (var i = 0; i < 4; i++) {
            polaGenap.push(genap[Math.floor(Math.random() * genap.length)]);
            polaGanjil.push(ganjil[Math.floor(Math.random() * ganjil.length)]);
        }
        formulas.push(polaGenap);
        formulas.push(polaGanjil);

        // 8. Random berbobot (kombinasi dari semua pola)
        for (var r = 0; r < 30; r++) {
            var base = formulas[Math.floor(Math.random() * formulas.length)];
            var rand = [
                (base[0] + Math.floor(Math.random() * 3)) % 10,
                (base[1] + Math.floor(Math.random() * 3)) % 10,
                (base[2] + Math.floor(Math.random() * 3)) % 10,
                (base[3] + Math.floor(Math.random() * 3)) % 10
            ];
            formulas.push(rand);
        }

        // === AMBIL SEJUMLAH FORMULA (unik) ===
        var unique = [];
        var seen = {};

        for (var f = 0; f < formulas.length; f++) {
            var key = formulas[f].join(',');
            if (!seen[key]) {
                seen[key] = true;
                unique.push(formulas[f]);
            }
        }

        // Ambil total set
        var finalResults = [];
        var shuffled = unique.slice();
        // Shuffle
        for (var s = shuffled.length - 1; s > 0; s--) {
            var j = Math.floor(Math.random() * (s + 1));
            var temp = shuffled[s];
            shuffled[s] = shuffled[j];
            shuffled[j] = temp;
        }

        // Ambil sesuai total yang diminta
        var take = Math.min(total, shuffled.length);
        for (var t = 0; t < take; t++) {
            finalResults.push(shuffled[t]);
        }

        // Jika kurang, tambahkan variasi
        while (finalResults.length < total) {
            var base2 = finalResults[Math.floor(Math.random() * finalResults.length)] || [0,0,0,0];
            var variant = [
                (base2[0] + Math.floor(Math.random() * 5)) % 10,
                (base2[1] + Math.floor(Math.random() * 5)) % 10,
                (base2[2] + Math.floor(Math.random() * 5)) % 10,
                (base2[3] + Math.floor(Math.random() * 5)) % 10
            ];
            var key2 = variant.join(',');
            if (!seen[key2]) {
                seen[key2] = true;
                finalResults.push(variant);
            }
        }

        return finalResults;
    }

    // ---- RENDER HASIL ----
    function renderResults(results) {
        resultGrid.innerHTML = '';
        for (var i = 0; i < results.length; i++) {
            var div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = results[i].join(' ') + '<span class="label">#' + (i+1) + '</span>';
            resultGrid.appendChild(div);
        }
        resultCount.textContent = results.length + ' set';
        resultBox.classList.add('active');
    }

    // ---- MAIN GENERATE ----
    function generate() {
        var a = parseInt(num1.value) || 0;
        var b = parseInt(num2.value) || 0;
        var c = parseInt(num3.value) || 0;
        var d = parseInt(num4.value) || 0;

        // Validasi
        if (a < 0 || a > 9 || b < 0 || b > 9 || c < 0 || c > 9 || d < 0 || d > 9) {
            alert('⚠️ Masukkan angka 0-9!');
            return;
        }

        var total = parseInt(jumlahSet.value) || 50;
        var angka = [a, b, c, d];
        var results = generateAngkaJadi(angka, total);
        renderResults(results);
    }

    // ---- COPY ----
    function copyAll() {
        var items = resultGrid.querySelectorAll('.result-item');
        var text = '';
        items.forEach(function(el) {
            text += el.textContent.replace('#\d+', '').trim() + '\n';
        });
        navigator.clipboard.writeText(text).then(function() {
            alert('✅ ' + items.length + ' set angka berhasil disalin!');
        }).catch(function() {
            // Fallback
            var ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            alert('✅ Berhasil disalin!');
        });
    }

    // ---- EXPORT TXT ----
    function exportTxt() {
        var items = resultGrid.querySelectorAll('.result-item');
        var text = '=== ANGKA JADI TOTO MACAU ===\n';
        text += 'Generated: ' + new Date().toLocaleString() + '\n\n';
        items.forEach(function(el, i) {
            text += (i+1) + '. ' + el.textContent.replace('#\d+', '').trim() + '\n';
        });
        
        var blob = new Blob([text], { type: 'text/plain' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'angka_jadi_' + new Date().getTime() + '.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // ---- EVENT ----
    generateBtn.addEventListener('click', generate);

    copyBtn.addEventListener('click', copyAll);
    exportBtn.addEventListener('click', exportTxt);

    // Enter key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            generate();
        }
    });

    // ---- AUTO GENERATE PERTAMA ----
    setTimeout(function() {
        generate();
    }, 300);

    console.log('✅ Simulasi Toto Macau siap!');
    console.log('📚 Edukasi matematika - Bukan perjudian');
</script>

</body>
</html>
