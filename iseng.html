<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Toto Macau</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f0ece6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #fff;
            border-radius: 24px;
            padding: 30px 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        h1 {
            text-align: center;
            color: #2d2419;
            font-size: 1.6rem;
            margin-bottom: 4px;
        }
        .sub {
            text-align: center;
            color: #8a7a68;
            font-size: 0.85rem;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            background: #2d5a3d;
            color: #fff;
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 0.6rem;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #2d2419;
            display: block;
            margin-bottom: 6px;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        .input-row input {
            flex: 1;
            padding: 14px;
            border: 2px solid #e0d6cc;
            border-radius: 14px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 700;
            outline: none;
        }
        .input-row input:focus {
            border-color: #2d5a3d;
        }
        select {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0d6cc;
            border-radius: 14px;
            font-size: 1rem;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 40px;
            background: #2d5a3d;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background: #1a3a2b;
            transform: scale(1.01);
        }
        .btn-gold {
            background: #d4a373;
        }
        .btn-gold:hover {
            background: #b8895e;
        }
        .result-box {
            margin-top: 20px;
            padding: 16px;
            background: #f6f2ec;
            border-radius: 16px;
            display: none;
            max-height: 400px;
            overflow-y: auto;
        }
        .result-box.active {
            display: block;
        }
        .result-item {
            background: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 6px;
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: 700;
            border: 1px solid #e8e0d8;
            display: flex;
            justify-content: space-between;
        }
        .result-item .num {
            color: #2d2419;
        }
        .result-item .idx {
            color: #8a7a68;
            font-size: 0.7rem;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }
        .btn-group .btn {
            padding: 12px;
            font-size: 0.85rem;
        }
        .count-info {
            text-align: right;
            font-size: 0.8rem;
            color: #8a7a68;
            margin-bottom: 10px;
        }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .input-row input { padding: 12px; font-size: 1.1rem; }
            .btn-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 Toto Macau Simulator</h1>
    <div class="sub">Edukasi Matematika <span class="badge">Bukan Judi</span></div>

    <div class="form-group">
        <label>📝 Masukkan 4 Angka Terakhir</label>
        <div class="input-row">
            <input type="number" id="n1" min="0" max="9" value="1">
            <input type="number" id="n2" min="0" max="9" value="2">
            <input type="number" id="n3" min="0" max="9" value="3">
            <input type="number" id="n4" min="0" max="9" value="4">
        </div>
    </div>

    <div class="form-group">
        <label>📊 Jumlah Set</label>
        <select id="totalSet">
            <option value="10">10 Set</option>
            <option value="20">20 Set</option>
            <option value="30">30 Set</option>
            <option value="40">40 Set</option>
            <option value="50" selected>50 Set</option>
            <option value="60">60 Set</option>
            <option value="70">70 Set</option>
            <option value="80">80 Set</option>
            <option value="90">90 Set</option>
            <option value="100">100 Set</option>
        </select>
    </div>

    <button class="btn" id="genBtn">🚀 Generate Angka Jadi</button>

    <div class="result-box" id="resultBox">
        <div class="count-info" id="countInfo">0 set</div>
        <div id="resultList"></div>
        <div class="btn-group">
            <button class="btn btn-gold" id="copyBtn">📋 Copy</button>
            <button class="btn btn-gold" id="exportBtn">⬇️ Export TXT</button>
        </div>
    </div>
</div>

<script>
    // ===== ELEMEN =====
    var n1 = document.getElementById('n1');
    var n2 = document.getElementById('n2');
    var n3 = document.getElementById('n3');
    var n4 = document.getElementById('n4');
    var totalSet = document.getElementById('totalSet');
    var genBtn = document.getElementById('genBtn');
    var resultBox = document.getElementById('resultBox');
    var resultList = document.getElementById('resultList');
    var countInfo = document.getElementById('countInfo');
    var copyBtn = document.getElementById('copyBtn');
    var exportBtn = document.getElementById('exportBtn');

    // ===== GENERATE =====
    function generate() {
        var a = parseInt(n1.value) || 0;
        var b = parseInt(n2.value) || 0;
        var c = parseInt(n3.value) || 0;
        var d = parseInt(n4.value) || 0;

        if (a < 0 || a > 9 || b < 0 || b > 9 || c < 0 || c > 9 || d < 0 || d > 9) {
            alert('Masukkan angka 0-9!');
            return;
        }

        var total = parseInt(totalSet.value) || 50;
        var results = [];

        // === RUMUS ===
        var formulas = [];

        // 1. Penjumlahan
        formulas.push([(a+b)%10, (b+c)%10, (c+d)%10, (a+d)%10]);
        formulas.push([(a+c)%10, (b+d)%10, (a+b+c)%10, (b+c+d)%10]);
        formulas.push([(a+b+c)%10, (a+b+d)%10, (a+c+d)%10, (b+c+d)%10]);

        // 2. Pengurangan
        formulas.push([Math.abs(a-b), Math.abs(b-c), Math.abs(c-d), Math.abs(a-d)]);
        formulas.push([Math.abs(a-c), Math.abs(b-d), Math.abs(a-d), Math.abs(b-c)]);

        // 3. Perkalian
        formulas.push([(a*b)%10, (b*c)%10, (c*d)%10, (a*d)%10]);

        // 4. Tesson
        var sum = a+b+c+d;
        var t = sum % 10;
        formulas.push([t, (t+1)%10, (t+2)%10, (t+3)%10]);
        formulas.push([(a+t)%10, (b+t)%10, (c+t)%10, (d+t)%10]);

        // 5. Mistis
        for (var i = 1; i <= 5; i++) {
            formulas.push([(a+i)%10, (b+i)%10, (c+i)%10, (d+i)%10]);
        }

        // 6. Kombinasi
        formulas.push([(a+b+c+d)%10, (a*b+c*d)%10, (a+b)*(c+d)%10, (a*b*c*d)%10]);

        // 7. Pola genap/ganjil
        var genap = [0,2,4,6,8];
        var ganjil = [1,3,5,7,9];
        formulas.push([genap[Math.floor(Math.random()*5)], genap[Math.floor(Math.random()*5)], genap[Math.floor(Math.random()*5)], genap[Math.floor(Math.random()*5)]]);
        formulas.push([ganjil[Math.floor(Math.random()*5)], ganjil[Math.floor(Math.random()*5)], ganjil[Math.floor(Math.random()*5)], ganjil[Math.floor(Math.random()*5)]]);

        // 8. Random berbobot
        for (var r = 0; r < 30; r++) {
            var base = formulas[Math.floor(Math.random() * formulas.length)];
            formulas.push([
                (base[0] + Math.floor(Math.random()*3)) % 10,
                (base[1] + Math.floor(Math.random()*3)) % 10,
                (base[2] + Math.floor(Math.random()*3)) % 10,
                (base[3] + Math.floor(Math.random()*3)) % 10
            ]);
        }

        // === UNIK ===
        var seen = {};
        var unique = [];
        for (var f = 0; f < formulas.length; f++) {
            var key = formulas[f].join(',');
            if (!seen[key]) {
                seen[key] = true;
                unique.push(formulas[f]);
            }
        }

        // === SHUFFLE ===
        for (var s = unique.length - 1; s > 0; s--) {
            var j = Math.floor(Math.random() * (s + 1));
            var temp = unique[s];
            unique[s] = unique[j];
            unique[j] = temp;
        }

        // === AMBIL ===
        var final = unique.slice(0, Math.min(total, unique.length));

        // Tambah variasi jika kurang
        while (final.length < total) {
            var base2 = final[Math.floor(Math.random() * final.length)] || [0,0,0,0];
            var variant = [
                (base2[0] + Math.floor(Math.random()*4)) % 10,
                (base2[1] + Math.floor(Math.random()*4)) % 10,
                (base2[2] + Math.floor(Math.random()*4)) % 10,
                (base2[3] + Math.floor(Math.random()*4)) % 10
            ];
            var key2 = variant.join(',');
            if (!seen[key2]) {
                seen[key2] = true;
                final.push(variant);
            }
        }

        // === RENDER ===
        var html = '';
        for (var i = 0; i < final.length; i++) {
            html += '<div class="result-item">';
            html += '<span class="num">' + final[i].join(' ') + '</span>';
            html += '<span class="idx">#' + (i+1) + '</span>';
            html += '</div>';
        }

        resultList.innerHTML = html;
        countInfo.textContent = final.length + ' set';
        resultBox.classList.add('active');
    }

    // ===== COPY =====
    function copyAll() {
        var items = resultList.querySelectorAll('.result-item .num');
        var text = '';
        items.forEach(function(el) {
            text += el.textContent.trim() + '\n';
        });
        navigator.clipboard.writeText(text).then(function() {
            alert('✅ ' + items.length + ' set disalin!');
        }).catch(function() {
            var ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            alert('✅ Disalin!');
        });
    }

    // ===== EXPORT =====
    function exportTxt() {
        var items = resultList.querySelectorAll('.result-item .num');
        var text = '=== ANGKA JADI ===\n';
        items.forEach(function(el, i) {
            text += (i+1) + '. ' + el.textContent.trim() + '\n';
        });
        var blob = new Blob([text], {type: 'text/plain'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'angka_jadi.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // ===== EVENT =====
    genBtn.addEventListener('click', generate);
    copyBtn.addEventListener('click', copyAll);
    exportBtn.addEventListener('click', exportTxt);

    // Auto generate pertama
    setTimeout(generate, 300);
</script>

</body>
</html>
